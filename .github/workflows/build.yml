# =========================================================
# build.yml — GitHub Actions برای ساخت APK (چند اپی)
# =========================================================

name: Build APK

on:
  push:
    paths:
      - 'configs/*.json'
  workflow_dispatch:
    inputs:
      app_slug:
        description: 'شناسه اپ (مثلاً: app01)'
        required: true
        type: string
        default: 'app01'

jobs:
  build:
    name: ساخت APK
    runs-on: ubuntu-latest

    steps:
      # ===== ۱. دریافت کد =====
      - name: 📥 دریافت کد
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # ===== ۲. تشخیص اپ =====
      - name: 🔍 تشخیص اپ
        id: detect
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            APP="${{ github.event.inputs.app_slug }}"
            echo "🔵 حالت دستی: $APP"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'configs/*.json' | head -n 1)
            echo "🔵 فایل تغییر یافته: $CHANGED"
            if [ -z "$CHANGED" ]; then
              CHANGED=$(ls configs/*.json | head -n 1)
            fi
            APP=$(basename "$CHANGED" .json)
          fi
          echo "app_slug=$APP" >> $GITHUB_OUTPUT
          echo "✅ اپ: $APP"

      # ===== ۳. نصب Java 17 =====
      - name: ☕ نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ===== ۴. Android SDK =====
      - name: 🤖 راه‌اندازی Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # ===== ۵. gradle-wrapper.jar =====
      - name: 📦 دانلود Gradle Wrapper JAR
        run: |
          mkdir -p template/gradle/wrapper
          curl -L -o template/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x template/gradlew

      # ===== ۶. 🧹 پاک کردن کش قدیمی =====
      - name: 🧹 پاک کردن کش قدیمی
        run: |
          echo "🧹 پاک کردن کش قدیمی..."
          rm -rf template/app/build
          rm -rf template/build
          rm -rf template/.gradle
          rm -rf template/app/.gradle
          rm -rf ~/.gradle/caches/build-cache-1
          rm -rf ~/.gradle/caches/transforms-*
          echo "✅ کش پاک شد"
          echo ""
          echo "📁 محتوای template/app/:"
          ls -la template/app/ || echo "template/app/ نیست"

      # ===== ۷. کپی تنظیمات =====
      - name: 📋 کپی تنظیمات
        run: |
          APP="${{ steps.detect.outputs.app_slug }}"
          if [ ! -f "configs/$APP.json" ]; then
            echo "❌ configs/$APP.json پیدا نشد"
            exit 1
          fi
          mkdir -p template/app/src/main/assets
          cp "configs/$APP.json" "template/app/src/main/assets/config.json"

          echo "✅ config.json کپی شد از $APP"
          echo ""
          echo "====================================================="
          echo "🔍 دیباگ: چک محتوای config.json داخل assets"
          echo "====================================================="
          echo "📏 حجم فایل:"
          wc -c "template/app/src/main/assets/config.json"
          echo ""
          echo "📄 چک کلیدهای اصلی با jq:"
          echo -n "  branding.app_name: "
          jq -r '.branding.app_name' "template/app/src/main/assets/config.json"
          echo -n "  splash.title: "
          jq -r '.splash.title' "template/app/src/main/assets/config.json"
          echo -n "  splash.enabled: "
          jq -r '.splash.enabled' "template/app/src/main/assets/config.json"
          echo -n "  onboarding.enabled: "
          jq -r '.onboarding.enabled' "template/app/src/main/assets/config.json"
          echo -n "  vpn.enabled: "
          jq -r '.vpn.enabled' "template/app/src/main/assets/config.json"
          echo -n "  vpn.recheck.text: "
          jq -r '.vpn.recheck.text' "template/app/src/main/assets/config.json"
          echo -n "  webview.url: "
          jq -r '.webview.url' "template/app/src/main/assets/config.json"
          echo -n "  colors.color_primary: "
          jq -r '.colors.color_primary' "template/app/src/main/assets/config.json"
          echo "====================================================="

      # ===== ۸. خواندن اطلاعات =====
      - name: 📖 خواندن اطلاعات
        id: cfg
        run: |
          APP="${{ steps.detect.outputs.app_slug }}"
          VER_NAME=$(jq -r '.branding.version_name // "1.0.0"' "configs/$APP.json")
          PKG=$(jq -r '.branding.package_name // "ir.rosha.app"' "configs/$APP.json")
          APP_NAME=$(jq -r '.branding.app_name // "app"' "configs/$APP.json")
          OUT_NAME=$(jq -r '.advanced.output_name // ""' "configs/$APP.json")

          if [ -z "$OUT_NAME" ] || [ "$OUT_NAME" == "null" ]; then
            OUT_NAME="$APP"
          fi

          echo "ver_name=$VER_NAME" >> $GITHUB_OUTPUT
          echo "package=$PKG" >> $GITHUB_OUTPUT
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "out_name=$OUT_NAME" >> $GITHUB_OUTPUT
          echo "📦 APK: $OUT_NAME.apk"

      # ===== ۹. کپی آیکون‌ها =====
      - name: 🎨 کپی آیکون‌ها
        run: |
          rm -rf template/app/src/main/res/mipmap-anydpi-v26

          mkdir -p template/app/src/main/res/mipmap-mdpi
          mkdir -p template/app/src/main/res/mipmap-hdpi
          mkdir -p template/app/src/main/res/mipmap-xhdpi
          mkdir -p template/app/src/main/res/mipmap-xxhdpi

          [ -f "template/icons/mdpi/icon.png" ] && \
            cp template/icons/mdpi/icon.png template/app/src/main/res/mipmap-mdpi/ic_launcher.png && \
            cp template/icons/mdpi/icon.png template/app/src/main/res/mipmap-mdpi/ic_launcher_round.png && echo "✅ mdpi"

          [ -f "template/icons/hdpi/icon.png" ] && \
            cp template/icons/hdpi/icon.png template/app/src/main/res/mipmap-hdpi/ic_launcher.png && \
            cp template/icons/hdpi/icon.png template/app/src/main/res/mipmap-hdpi/ic_launcher_round.png && echo "✅ hdpi"

          [ -f "template/icons/xhdpi/icon.png" ] && \
            cp template/icons/xhdpi/icon.png template/app/src/main/res/mipmap-xhdpi/ic_launcher.png && \
            cp template/icons/xhdpi/icon.png template/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png && echo "✅ xhdpi"

          [ -f "template/icons/xxhdpi/icon.png" ] && \
            cp template/icons/xxhdpi/icon.png template/app/src/main/res/mipmap-xxhdpi/ic_launcher.png && \
            cp template/icons/xxhdpi/icon.png template/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png && echo "✅ xxhdpi"

          mkdir -p template/app/src/main/res/drawable
          [ -f "template/icons/splash.png" ] && \
            cp template/icons/splash.png template/app/src/main/res/drawable/splash_logo.png && echo "✅ splash"

      # ===== ۱۰. Keystore =====
      - name: 🔑 ساخت keystore
        run: |
          mkdir -p template/app/keystore
          keytool -genkeypair -v \
            -keystore template/app/keystore/temp.jks \
            -alias tempkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "rosha${{ github.run_id }}" \
            -keypass "rosha${{ github.run_id }}" \
            -dname "CN=Rosha, OU=Apps, O=Rosha, L=Tehran, S=Tehran, C=IR"

      - name: 🔧 دسترسی اجرا
        run: chmod +x template/gradlew

      # ===== ۱۱. Build APK =====
      - name: 🏗️ ساخت APK
        working-directory: ./template
        run: |
          KEYSTORE_PATH="$PWD/app/keystore/temp.jks"
          ./gradlew clean --no-build-cache assembleRelease \
            -PappPackageName="${{ steps.cfg.outputs.package }}" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="rosha${{ github.run_id }}" \
            -Pandroid.injected.signing.key.alias=tempkey \
            -Pandroid.injected.signing.key.password="rosha${{ github.run_id }}" \
            --no-daemon --stacktrace --refresh-dependencies

      # ===== ۱۲. بررسی APK ساخته‌شده =====
      - name: 🔍 بررسی محتوای APK
        run: |
          APK=$(find template/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "❌ APK پیدا نشد"
            exit 1
          fi
          echo "📦 APK پیدا شد: $APK"
          echo ""
          echo "🔍 چک محتوای assets داخل APK:"
          unzip -l "$APK" | grep -i "assets" || echo "⚠️ assets پیدا نشد"
          echo ""
          echo "🔍 استخراج config.json از APK:"
          mkdir -p /tmp/apk_check
          unzip -o "$APK" "assets/config.json" -d /tmp/apk_check/ || echo "⚠️ config.json توی APK نیست"
          if [ -f "/tmp/apk_check/assets/config.json" ]; then
            echo "✅ config.json داخل APK هست"
            echo "📏 حجم:"
            wc -c /tmp/apk_check/assets/config.json
            echo ""
            echo "🔍 چک مقادیر داخل APK:"
            echo -n "  splash.title: "
            jq -r '.splash.title' /tmp/apk_check/assets/config.json
            echo -n "  colors.color_primary: "
            jq -r '.colors.color_primary' /tmp/apk_check/assets/config.json
            echo -n "  webview.url: "
            jq -r '.webview.url' /tmp/apk_check/assets/config.json
          else
            echo "❌❌❌ config.json توی APK نیست! این مشکل اصلیه!"
          fi

      # ===== ۱۳. تغییر نام APK =====
      - name: 📝 تغییر نام APK
        run: |
          OUT_NAME="${{ steps.cfg.outputs.out_name }}"
          APK=$(find template/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "❌ APK پیدا نشد"
            exit 1
          fi
          mkdir -p output
          cp "$APK" "output/${OUT_NAME}.apk"
          echo "✅ APK: ${OUT_NAME}.apk"

      # ===== ۱۴. آپلود =====
      - name: 📤 آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ steps.cfg.outputs.out_name }}
          path: output/*.apk
          retention-days: 30

      # ===== ۱۵. پاک کردن keystore =====
      - name: 🗑️ پاک کردن keystore
        if: always()
        run: rm -rf template/app/keystore
