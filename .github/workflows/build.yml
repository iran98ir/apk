# =========================================================
# build.yml — GitHub Actions برای ساخت APK
# مسیر: .github/workflows/build.yml
# =========================================================

name: Build APK

on:
  push:
    paths:
      - 'configs/*.json'
  workflow_dispatch:
    inputs:
      app_slug:
        description: 'شناسه‌ی اپ'
        required: true
        type: string
        default: 'app01'

jobs:
  build:
    name: ساخت APK
    runs-on: ubuntu-latest

    steps:
      # ===== ۱. دریافت کد =====
      - name: 📥 دریافت کد
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===== ۲. تشخیص اپ =====
      - name: 🔍 تشخیص اپ
        id: detect
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            APP="${{ github.event.inputs.app_slug }}"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '^configs/.*\.json$' | head -n 1 || echo "")
            if [ -z "$CHANGED" ]; then
              APP="app01"
            else
              APP=$(basename "$CHANGED" .json)
            fi
          fi
          echo "app_slug=$APP" >> $GITHUB_OUTPUT
          echo "✅ اپ: $APP"

      # ===== ۳. نصب Java 17 =====
      - name: ☕ نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ===== ۴. راه‌اندازی Android SDK =====
      - name: 🤖 راه‌اندازی Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # ===== ۵. دانلود gradle-wrapper.jar =====
      - name: 📦 دانلود Gradle Wrapper JAR
        run: |
          mkdir -p template/gradle/wrapper
          curl -L -o template/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x template/gradlew
          echo "✅ wrapper.jar دانلود شد"

      # ===== ۶. کش Gradle =====
      - name: ⚡ کش Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ===== ۷. کپی تنظیمات =====
      - name: 📋 کپی تنظیمات اپ
        run: |
          APP="${{ steps.detect.outputs.app_slug }}"
          if [ ! -f "configs/$APP.json" ]; then
            echo "❌ فایل configs/$APP.json پیدا نشد"
            exit 1
          fi
          mkdir -p template/app/src/main/assets
          cp "configs/$APP.json" "template/app/src/main/assets/config.json"
          echo "✅ تنظیمات $APP کپی شد"

      # ===== ۸. خواندن اطلاعات =====
      - name: 📖 خواندن اطلاعات
        id: cfg
        run: |
          APP="${{ steps.detect.outputs.app_slug }}"
          VER_NAME=$(jq -r '.branding.version_name // "1.0.0"' "configs/$APP.json")
          PKG=$(jq -r '.branding.package_name // "ir.rosha.app"' "configs/$APP.json")
          echo "ver_name=$VER_NAME" >> $GITHUB_OUTPUT
          echo "package=$PKG" >> $GITHUB_OUTPUT

      # ===== ۹. دانلود آیکون‌ها از پنل (با پروکسی) =====
      - name: 🎨 دانلود آیکون‌ها از پنل
        run: |
          APP="${{ steps.detect.outputs.app_slug }}"
          BASE_URL="https://rosha-24.ir"
          PROXY="https://api.allorigins.win/raw?url="
          PROXY2="https://corsproxy.io/?"

          ICON_48=$(jq -r '.branding.icon_48 // ""' "configs/$APP.json")
          ICON_72=$(jq -r '.branding.icon_72 // ""' "configs/$APP.json")
          ICON_96=$(jq -r '.branding.icon_96 // ""' "configs/$APP.json")
          ICON_144=$(jq -r '.branding.icon_144 // ""' "configs/$APP.json")

          echo "📥 دانلود آیکون‌ها..."

          rm -rf template/app/src/main/res/mipmap-anydpi-v26

          mkdir -p template/app/src/main/res/mipmap-mdpi
          mkdir -p template/app/src/main/res/mipmap-hdpi
          mkdir -p template/app/src/main/res/mipmap-xhdpi
          mkdir -p template/app/src/main/res/mipmap-xxhdpi

          download_icon() {
            local url="$1"
            local output="$2"
            local name="$3"

            echo "🔽 $name"

            # ===== تلاش ۱: مستقیم =====
            if curl -f -L --max-time 15 -o "$output" "$url" 2>/dev/null; then
              echo "  ✅ مستقیم"
              return 0
            fi

            # ===== تلاش ۲: allorigins =====
            local encoded=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$url")
            if curl -f -L --max-time 30 -o "$output" "${PROXY}${encoded}" 2>/dev/null; then
              echo "  ✅ همه‌گیرها (allorigins)"
              return 0
            fi

            # ===== تلاش ۳: corsproxy.io =====
            if curl -f -L --max-time 30 -o "$output" "${PROXY2}${encoded}" 2>/dev/null; then
              echo "  ✅ corsproxy"
              return 0
            fi

            # ===== تلاش ۴: weserv (تصویر) =====
            if curl -f -L --max-time 30 -o "$output" "https://images.weserv.nl/?url=${url#https://}" 2>/dev/null; then
              echo "  ✅ weserv"
              return 0
            fi

            echo "  ❌ fail"
            return 1
          }

          [ -n "$ICON_48" ] && [ "$ICON_48" != "null" ] && \
            download_icon "$BASE_URL$ICON_48" "template/app/src/main/res/mipmap-mdpi/ic_launcher.png" "icon_48"

          [ -n "$ICON_72" ] && [ "$ICON_72" != "null" ] && \
            download_icon "$BASE_URL$ICON_72" "template/app/src/main/res/mipmap-hdpi/ic_launcher.png" "icon_72"

          [ -n "$ICON_96" ] && [ "$ICON_96" != "null" ] && \
            download_icon "$BASE_URL$ICON_96" "template/app/src/main/res/mipmap-xhdpi/ic_launcher.png" "icon_96"

          [ -n "$ICON_144" ] && [ "$ICON_144" != "null" ] && \
            download_icon "$BASE_URL$ICON_144" "template/app/src/main/res/mipmap-xxhdpi/ic_launcher.png" "icon_144"

          echo ""
          echo "🎨 لیست آیکون‌ها:"
          find template/app/src/main/res -name "ic_launcher*" -type f

          echo ""
          echo "📏 ابعاد:"
          for f in $(find template/app/src/main/res -name "ic_launcher.png"); do
            file "$f"
          done

      # ===== ۱۰. Keystore موقت =====
      - name: 🔑 ساخت keystore موقت
        run: |
          mkdir -p template/app/keystore
          keytool -genkeypair -v \
            -keystore template/app/keystore/temp.jks \
            -alias tempkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "rosha${{ github.run_id }}" \
            -keypass "rosha${{ github.run_id }}" \
            -dname "CN=Rosha, OU=Apps, O=Rosha, L=Tehran, S=Tehran, C=IR"
          echo "✅ Keystore ساخته شد"

      # ===== ۱۱. دسترسی اجرا =====
      - name: 🔧 دسترسی اجرا
        run: chmod +x template/gradlew

      # ===== ۱۲. Build APK =====
      - name: 🏗️ ساخت APK
        working-directory: ./template
        run: |
          KEYSTORE_PATH="$PWD/app/keystore/temp.jks"
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="rosha${{ github.run_id }}" \
            -Pandroid.injected.signing.key.alias=tempkey \
            -Pandroid.injected.signing.key.password="rosha${{ github.run_id }}" \
            --no-daemon --stacktrace

      # ===== ۱۳. تغییر نام =====
      - name: 📝 تغییر نام APK
        run: |
          APP="${{ steps.detect.outputs.app_slug }}"
          OUT_NAME=$(jq -r '.advanced.output_name // ""' "configs/$APP.json")
          if [ -z "$OUT_NAME" ] || [ "$OUT_NAME" == "null" ]; then
            OUT_NAME="$APP"
          fi
          APK=$(find template/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "❌ APK پیدا نشد"
            exit 1
          fi
          mkdir -p output
          cp "$APK" "output/${OUT_NAME}.apk"
          echo "✅ APK: ${OUT_NAME}.apk"

      # ===== ۱۴. آپلود APK =====
      - name: 📤 آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ steps.detect.outputs.app_slug }}
          path: output/*.apk
          retention-days: 30

      # ===== ۱۵. پاک کردن keystore =====
      - name: 🗑️ پاک کردن keystore
        if: always()
        run: rm -rf template/app/keystore

      # ===== ۱۶. خلاصه =====
      - name: ✅ خلاصه
        run: |
          echo "🎉 Build موفق"
          echo "اپ: ${{ steps.detect.outputs.app_slug }}"
          echo "نسخه: ${{ steps.cfg.outputs.ver_name }}"
          echo "پکیج: ${{ steps.cfg.outputs.package }}"
