# =========================================================
# build.yml — GitHub Actions برای ساخت APK
# =========================================================

name: Build APK

on:
  push:
    paths:
      - 'configs/*.json'
  workflow_dispatch:
    inputs:
      app_slug:
        description: 'شناسه‌ی اپ'
        required: true
        type: string
        default: 'app01'

jobs:
  build:
    name: ساخت APK
    runs-on: ubuntu-latest

    steps:
      # ===== ۱. دریافت کد =====
      - name: 📥 دریافت کد
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===== ۲. تشخیص اپ =====
      - name: 🔍 تشخیص اپ
        id: detect
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            APP="${{ github.event.inputs.app_slug }}"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '^configs/.*\.json$' | head -n 1 || echo "")
            if [ -z "$CHANGED" ]; then
              APP="app01"
            else
              APP=$(basename "$CHANGED" .json)
            fi
          fi
          echo "app_slug=$APP" >> $GITHUB_OUTPUT
          echo "✅ اپ: $APP"

      # ===== ۳. نصب Java 17 =====
      - name: ☕ نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ===== ۴. راه‌اندازی Android SDK =====
      - name: 🤖 راه‌اندازی Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      # ===== ۵. دانلود gradle-wrapper.jar =====
      - name: 📦 دانلود Gradle Wrapper JAR
        run: |
          mkdir -p template/gradle/wrapper
          curl -L -o template/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x template/gradlew
          echo "✅ wrapper.jar دانلود شد"

      # ===== ۶. کپی تنظیمات =====
      - name: 📋 کپی تنظیمات اپ
        run: |
          APP="${{ steps.detect.outputs.app_slug }}"
          if [ ! -f "configs/$APP.json" ]; then
            echo "❌ فایل configs/$APP.json پیدا نشد"
            exit 1
          fi
          mkdir -p template/app/src/main/assets
          cp "configs/$APP.json" "template/app/src/main/assets/config.json"
          echo "✅ تنظیمات $APP کپی شد"

      # ===== ۷. خواندن اطلاعات =====
      - name: 📖 خواندن اطلاعات
        id: cfg
        run: |
          APP="${{ steps.detect.outputs.app_slug }}"
          VER_NAME=$(jq -r '.branding.version_name // "1.0.0"' "configs/$APP.json")
          PKG=$(jq -r '.branding.package_name // "ir.rosha.app"' "configs/$APP.json")
          echo "ver_name=$VER_NAME" >> $GITHUB_OUTPUT
          echo "package=$PKG" >> $GITHUB_OUTPUT

      # ===== ۸. کپی آیکون‌ها از پوشه‌ی template/icons =====
      - name: 🎨 کپی آیکون‌ها از template/icons
        run: |
          echo "📥 کپی آیکون‌ها از پوشه‌ی template/icons..."

          # حذف آیکون‌های پیش‌فرض
          rm -rf template/app/src/main/res/mipmap-anydpi-v26

          # ساخت پوشه‌های mipmap
          mkdir -p template/app/src/main/res/mipmap-mdpi
          mkdir -p template/app/src/main/res/mipmap-hdpi
          mkdir -p template/app/src/main/res/mipmap-xhdpi
          mkdir -p template/app/src/main/res/mipmap-xxhdpi

          # کپی آیکون‌ها (اگه وجود داشته باشن)
          if [ -f "template/icons/mdpi/icon.png" ]; then
            cp template/icons/mdpi/icon.png template/app/src/main/res/mipmap-mdpi/ic_launcher.png
            echo "✅ mdpi/icon.png"
          else
            echo "⚠️ mdpi/icon.png نیست"
          fi

          if [ -f "template/icons/hdpi/icon.png" ]; then
            cp template/icons/hdpi/icon.png template/app/src/main/res/mipmap-hdpi/ic_launcher.png
            echo "✅ hdpi/icon.png"
          else
            echo "⚠️ hdpi/icon.png نیست"
          fi

          if [ -f "template/icons/xhdpi/icon.png" ]; then
            cp template/icons/xhdpi/icon.png template/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            echo "✅ xhdpi/icon.png"
          else
            echo "⚠️ xhdpi/icon.png نیست"
          fi

          if [ -f "template/icons/xxhdpi/icon.png" ]; then
            cp template/icons/xxhdpi/icon.png template/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            echo "✅ xxhdpi/icon.png"
          else
            echo "⚠️ xxhdpi/icon.png نیست"
          fi

          # لوگو اسپلش
          mkdir -p template/app/src/main/res/drawable
          if [ -f "template/icons/splash.png" ]; then
            cp template/icons/splash.png template/app/src/main/res/drawable/splash_logo.png
            echo "✅ splash.png"
          else
            echo "⚠️ splash.png نیست"
          fi

          echo ""
          echo "🎨 لیست آیکون‌ها:"
          find template/app/src/main/res -name "ic_launcher*" -type f
          find template/app/src/main/res -name "splash_logo*" -type f

      # ===== ۹. Keystore موقت =====
      - name: 🔑 ساخت keystore موقت
        run: |
          mkdir -p template/app/keystore
          keytool -genkeypair -v \
            -keystore template/app/keystore/temp.jks \
            -alias tempkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "rosha${{ github.run_id }}" \
            -keypass "rosha${{ github.run_id }}" \
            -dname "CN=Rosha, OU=Apps, O=Rosha, L=Tehran, S=Tehran, C=IR"
          echo "✅ Keystore ساخته شد"

      # ===== ۱۰. دسترسی اجرا =====
      - name: 🔧 دسترسی اجرا
        run: chmod +x template/gradlew

      # ===== ۱۱. Build APK =====
      - name: 🏗️ ساخت APK
        working-directory: ./template
        run: |
          KEYSTORE_PATH="$PWD/app/keystore/temp.jks"
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="rosha${{ github.run_id }}" \
            -Pandroid.injected.signing.key.alias=tempkey \
            -Pandroid.injected.signing.key.password="rosha${{ github.run_id }}" \
            --no-daemon --stacktrace

      # ===== ۱۲. تغییر نام =====
      - name: 📝 تغییر نام APK
        run: |
          APP="${{ steps.detect.outputs.app_slug }}"
          OUT_NAME=$(jq -r '.advanced.output_name // ""' "configs/$APP.json")
          if [ -z "$OUT_NAME" ] || [ "$OUT_NAME" == "null" ]; then
            OUT_NAME="$APP"
          fi
          APK=$(find template/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "❌ APK پیدا نشد"
            exit 1
          fi
          mkdir -p output
          cp "$APK" "output/${OUT_NAME}.apk"
          echo "✅ APK: ${OUT_NAME}.apk"

      # ===== ۱۳. آپلود APK =====
      - name: 📤 آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ steps.detect.outputs.app_slug }}
          path: output/*.apk
          retention-days: 30

      # ===== ۱۴. پاک کردن keystore =====
      - name: 🗑️ پاک کردن keystore
        if: always()
        run: rm -rf template/app/keystore

      # ===== ۱۵. خلاصه =====
      - name: ✅ خلاصه
        run: |
          echo "🎉 Build موفق"
          echo "اپ: ${{ steps.detect.outputs.app_slug }}"
          echo "نسخه: ${{ steps.cfg.outputs.ver_name }}"
          echo "پکیج: ${{ steps.cfg.outputs.package }}"
