name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ─────────────── ۱) Checkout ───────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────── ۲) Setup JDK ───────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ─────────────── ۳) Setup Python ───────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ─────────────── ۴) Validate assets ───────────────
      - name: Validate assets
        run: |
          if [ ! -f "assets/icon.png" ]; then
            echo "::error::فایل assets/icon.png پیدا نشد"
            exit 1
          fi
          if [ ! -f "assets/round.png" ]; then
            echo "::error::فایل assets/round.png پیدا نشد"
            exit 1
          fi
          echo "✓ assets کامل است"

      # ─────────────── ۵) Validate app.json ───────────────
      - name: Validate config/app.json
        run: |
          python3 - <<'PY'
          import json, sys, re

          p = "config/app.json"
          try:
              d = json.load(open(p, encoding="utf-8"))
          except Exception as e:
              print(f"::error::app.json یافت نشد یا نامعتبر است: {e}")
              sys.exit(1)

          errs = []

          def req(path, label):
              cur = d
              for k in path.split("."):
                  if isinstance(cur, dict) and k in cur:
                      cur = cur[k]
                  else:
                      errs.append(f"{label} خالی است")
                      return None
              if cur in ("", None):
                  errs.append(f"{label} خالی است")
                  return None
              return cur

          # برندینگ
          req("brand.mode", "حالت اپ")
          req("brand.name", "نام اپ")
          pkg = req("brand.pkg", "نام پکیج")
          req("brand.ver",   "نسخه")
          req("brand.vcode", "کد نسخه")

          # اسپلش
          req("splash.bg", "رنگ پس‌زمینه اسپلش")
          req("splash.txt", "رنگ متن اسپلش")

          # ولکام
          if d.get("welcome", {}).get("active", True):
              req("welcome.bg", "رنگ پس‌زمینه ولکام")
              req("welcome.txt", "رنگ متن ولکام")

          # خطا
          req("error.bg",  "رنگ پس‌زمینه خطا")
          req("error.txt", "رنگ متن خطا")

          # وب‌ویوئر
          url = req("web.url", "لینک وب‌ویوئر")

          # اعتبار پکیج
          if pkg and not re.match(r'^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$', pkg):
              errs.append("فرمت نام پکیج نامعتبر است")

          # اعتبار URL
          if url and not re.match(r'^https?://.+', url):
              errs.append("آدرس وب‌ویوئر باید با http/https شروع شود")

          # اعتبار حالت
          if d.get("brand", {}).get("mode") not in ("new", "update"):
              errs.append("حالت اپ نامعتبر است (باید new یا update باشد)")

          if errs:
              for e in errs:
                  print(f"::error::{e}")
              sys.exit(1)

          print("✓ app.json معتبر است")
          PY

      # ─────────────── ۶) Copy icons to mipmap ───────────────
      - name: Copy icons to mipmap folders
        run: |
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$density"
            cp assets/icon.png  "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp assets/round.png "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          echo "✓ آیکون‌ها در ۵ پوشه mipmap کپی شدند"

      # ─────────────── ۷) Inject values ───────────────
      - name: Inject config values
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          d = json.load(open("config/app.json", encoding="utf-8"))

          # ── AndroidManifest: package + deeplink ──
          pkg = d["brand"]["pkg"]
          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              txt = manifest.read_text(encoding="utf-8")
              txt = txt.replace("@PKG@", pkg)

              web = d.get("web", {})
              if web.get("deepLink", True) and web.get("deepLinkUrl"):
                  url = web["deepLinkUrl"]
                  m = re.match(r'^([a-zA-Z][a-zA-Z0-9+\-.]*):\/\/([^\/]+)', url)
                  if m:
                      txt = txt.replace("@DeepLinkScheme@", m.group(1))
                      txt = txt.replace("@DeepLinkHost@", m.group(2))
                  else:
                      txt = re.sub(
                          r'<!-- DEEPLINK_START -->.*?<!-- DEEPLINK_END -->',
                          '', txt, flags=re.DOTALL
                      )
              else:
                  txt = re.sub(
                      r'<!-- DEEPLINK_START -->.*?<!-- DEEPLINK_END -->',
                      '', txt, flags=re.DOTALL
                  )
              manifest.write_text(txt, encoding="utf-8")

          # ── strings.xml ──
          s = pathlib.Path("android/app/src/main/res/values/strings.xml")
          if s.exists():
              st = s.read_text(encoding="utf-8")
              repl = {
                  "@APP_NAME@":  d["brand"]["name"],
                  "@SPLASH_T@":  d.get("splash",{}).get("title",""),
                  "@WELCOME_T@": d.get("welcome",{}).get("t",""),
                  "@WELCOME_D@": d.get("welcome",{}).get("d",""),
                  "@WELCOME_B@": d.get("welcome",{}).get("btn",""),
                  "@EXIT_T@":    d.get("exit",{}).get("t",""),
                  "@EXIT_M@":    d.get("exit",{}).get("m",""),
                  "@EXIT_Y@":    d.get("exit",{}).get("yes",""),
                  "@EXIT_N@":    d.get("exit",{}).get("no",""),
              }
              for k, v in repl.items():
                  st = st.replace(k, str(v).replace("&","&amp;").replace("<","&lt;"))
              s.write_text(st, encoding="utf-8")

          # ── colors.xml ──
          c = pathlib.Path("android/app/src/main/res/values/colors.xml")
          if c.exists():
              ct = c.read_text(encoding="utf-8")
              crepl = {
                  "@SPLASH_BG@":   d.get("splash",{}).get("bg", "#FFFFFF"),
                  "@SPLASH_TXT@":  d.get("splash",{}).get("txt", "#000000"),
                  "@WELCOME_BG@":  d.get("welcome",{}).get("bg", "#FFFFFF"),
                  "@WELCOME_TXT@": d.get("welcome",{}).get("txt", "#000000"),
                  "@ERROR_BG@":    d.get("error",{}).get("bg", "#FFFFFF"),
                  "@ERROR_TXT@":   d.get("error",{}).get("txt", "#000000"),
              }
              for k, v in crepl.items():
                  ct = ct.replace(k, str(v))
              c.write_text(ct, encoding="utf-8")

          # ── app/build.gradle ──
          g = pathlib.Path("android/app/build.gradle")
          if g.exists():
              gt = g.read_text(encoding="utf-8")
              gt = gt.replace("@PKG@", pkg)
              gt = gt.replace("@VER@", str(d["brand"]["ver"]))
              gt = gt.replace("@VCODE@", str(d["brand"]["vcode"]))
              g.write_text(gt, encoding="utf-8")

          # ── کپی app.json به assets ──
          assets_dir = pathlib.Path("android/app/src/main/assets")
          assets_dir.mkdir(parents=True, exist_ok=True)
          (assets_dir / "app.json").write_text(
              json.dumps(d, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("✓ مقادیر تزریق شد")
          PY

      # ─────────────── ۸) Keystore check ───────────────
      - name: Check keystore
        run: |
          if [ ! -f "android/app/keystore/release.jks" ]; then
            echo "::error::فایل keystore پیدا نشد — android/app/keystore/release.jks"
            exit 1
          fi
          echo "✓ keystore موجود است"

      # ─────────────── ۹) Setup Gradle ───────────────
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2.1

      # ─────────────── ۱۰) Build APK ───────────────
      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS:     ${{ secrets.KEY_ALIAS }}
          KEY_PASS:      ${{ secrets.KEY_PASS }}
        run: |
          if [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::کلیدهای امضا در Secrets تنظیم نشده‌اند"
            exit 1
          fi
          gradle assembleRelease --no-daemon

      # ─────────────── ۱۱) Upload APK ───────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
