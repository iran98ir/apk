# =========================================================
# build.yml — GitHub Actions برای ساخت APK
# مسیر: .github/workflows/build.yml
# =========================================================
# این فایل هر بار که push کنی:
# 1. inject.py رو اجرا می‌کنه (JSON رو به کد تبدیل می‌کنه)
# 2. اگه JSON ناقص باشه → build متوقف می‌شه ❌
# 3. اگه کامل باشه → APK می‌سازه ✅
# =========================================================

name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      # ===== ۱. چک‌اوت کد =====
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== ۲. نصب JDK 17 =====
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ===== ۳. نصب Python =====
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ===== ۴. اجرای inject.py (JSON → کد) =====
      - name: Run inject.py
        run: python scripts/inject.py

      # ===== ۵. ساخت Gradle Wrapper JAR =====
      - name: Setup Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew || true

      # ===== ۶. کش Gradle =====
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ===== ۷. اجازه اجرای gradlew =====
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      # ===== ۸. ساخت Keystore خودکار =====
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias appkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass AppPass@2026 \
            -keypass AppPass@2026 \
            -dname "CN=App, OU=Dev, O=Rayan, L=Tehran, S=Tehran, C=IR"

      # ===== ۹. تنظیم امضا =====
      - name: Setup signing config
        run: |
          echo "RELEASE_STORE_FILE=../release.keystore" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=AppPass@2026" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=appkey" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=AppPass@2026" >> gradle.properties

      # ===== ۱۰. Build APK (Debug) =====
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ===== ۱۱. Build APK (Release) =====
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # ===== ۱۲. آپلود APK Debug =====
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # ===== ۱۳. آپلود APK Release =====
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
