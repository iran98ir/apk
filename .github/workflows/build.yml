# =========================================================
# build.yml — GitHub Actions برای ساخت APK
# =========================================================

name: Build APK

on:
  push:
    paths:
      - 'configs/*.json'
  workflow_dispatch:
    inputs:
      app_slug:
        description: 'شناسه‌ی اپ'
        required: true
        type: string
        default: 'app01'

jobs:
  build:
    name: ساخت APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 دریافت کد
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 تشخیص اپ
        id: detect
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            APP="${{ github.event.inputs.app_slug }}"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '^configs/.*\.json$' | head -n 1 || echo "")
            if [ -z "$CHANGED" ]; then
              APP="app01"
            else
              APP=$(basename "$CHANGED" .json)
            fi
          fi
          echo "app_slug=$APP" >> $GITHUB_OUTPUT
          echo "✅ اپ: $APP"

      - name: ☕ نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 راه‌اندازی Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: 📦 دانلود Gradle Wrapper JAR
        run: |
          mkdir -p template/gradle/wrapper
          curl -L -o template/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x template/gradlew

      - name: ⚡ کش Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 📋 کپی تنظیمات اپ
        run: |
          APP="${{ steps.detect.outputs.app_slug }}"
          if [ ! -f "configs/$APP.json" ]; then
            echo "❌ فایل configs/$APP.json پیدا نشد"
            exit 1
          fi
          mkdir -p template/app/src/main/assets
          cp "configs/$APP.json" "template/app/src/main/assets/config.json"
          echo "✅ تنظیمات $APP کپی شد"

      - name: 📖 خواندن اطلاعات
        id: cfg
        run: |
          APP="${{ steps.detect.outputs.app_slug }}"
          VER_NAME=$(jq -r '.branding.version_name // "1.0.0"' "configs/$APP.json")
          PKG=$(jq -r '.branding.package_name // "ir.rosha.app"' "configs/$APP.json")
          echo "ver_name=$VER_NAME" >> $GITHUB_OUTPUT
          echo "package=$PKG" >> $GITHUB_OUTPUT

      - name: 🎨 دانلود آیکون‌ها از پنل
        run: |
          APP="${{ steps.detect.outputs.app_slug }}"
          BASE_URL="https://rosha-24.ir"

          ICON_48=$(jq -r '.branding.icon_48 // ""' "configs/$APP.json")
          ICON_72=$(jq -r '.branding.icon_72 // ""' "configs/$APP.json")
          ICON_96=$(jq -r '.branding.icon_96 // ""' "configs/$APP.json")
          ICON_144=$(jq -r '.branding.icon_144 // ""' "configs/$APP.json")

          echo "📥 دانلود آیکون‌ها..."

          rm -rf template/app/src/main/res/mipmap-anydpi-v26

          mkdir -p template/app/src/main/res/mipmap-mdpi
          mkdir -p template/app/src/main/res/mipmap-hdpi
          mkdir -p template/app/src/main/res/mipmap-xhdpi
          mkdir -p template/app/src/main/res/mipmap-xxhdpi

          [ -n "$ICON_48" ] && [ "$ICON_48" != "null" ] && \
            curl -f -L -o template/app/src/main/res/mipmap-mdpi/ic_launcher.png "$BASE_URL$ICON_48" && echo "✅ icon_48"

          [ -n "$ICON_72" ] && [ "$ICON_72" != "null" ] && \
            curl -f -L -o template/app/src/main/res/mipmap-hdpi/ic_launcher.png "$BASE_URL$ICON_72" && echo "✅ icon_72"

          [ -n "$ICON_96" ] && [ "$ICON_96" != "null" ] && \
            curl -f -L -o template/app/src/main/res/mipmap-xhdpi/ic_launcher.png "$BASE_URL$ICON_96" && echo "✅ icon_96"

          [ -n "$ICON_144" ] && [ "$ICON_144" != "null" ] && \
            curl -f -L -o template/app/src/main/res/mipmap-xxhdpi/ic_launcher.png "$BASE_URL$ICON_144" && echo "✅ icon_144"

          echo "🎨 لیست:"
          find template/app/src/main/res -name "ic_launcher*" -type f

      - name: 🔑 ساخت keystore موقت
        run: |
          mkdir -p template/app/keystore
          keytool -genkeypair -v \
            -keystore template/app/keystore/temp.jks \
            -alias tempkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "rosha${{ github.run_id }}" \
            -keypass "rosha${{ github.run_id }}" \
            -dname "CN=Rosha, OU=Apps, O=Rosha, L=Tehran, S=Tehran, C=IR"

      - name: 🔧 دسترسی اجرا
        run: chmod +x template/gradlew

      - name: 🏗️ ساخت APK
        working-directory: ./template
        run: |
          KEYSTORE_PATH="$PWD/app/keystore/temp.jks"
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="rosha${{ github.run_id }}" \
            -Pandroid.injected.signing.key.alias=tempkey \
            -Pandroid.injected.signing.key.password="rosha${{ github.run_id }}" \
            --no-daemon --stacktrace

      - name: 📝 تغییر نام APK
        run: |
          APP="${{ steps.detect.outputs.app_slug }}"
          OUT_NAME=$(jq -r '.advanced.output_name // ""' "configs/$APP.json")
          if [ -z "$OUT_NAME" ] || [ "$OUT_NAME" == "null" ]; then
            OUT_NAME="$APP"
          fi
          APK=$(find template/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "❌ APK پیدا نشد"
            exit 1
          fi
          mkdir -p output
          cp "$APK" "output/${OUT_NAME}.apk"
          echo "✅ APK: ${OUT_NAME}.apk"

      - name: 📤 آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ steps.detect.outputs.app_slug }}
          path: output/*.apk
          retention-days: 30

      - name: 🗑️ پاک کردن keystore
        if: always()
        run: rm -rf template/app/keystore
