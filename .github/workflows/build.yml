# =========================================================
# build.yml — GitHub Actions برای ساخت APK
# مسیر: .github/workflows/build.yml
# =========================================================
# 📌 این فایل، وقتی تو پنل دکمه‌ی Build رو بزنی، خودکار اجرا میشه
# 📌 APK ساخته میشه و به عنوان Artifact ذخیره میشه
# =========================================================

name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_slug:
        description: 'شناسه‌ی اپ (app01, app02, ...)'
        required: true
        type: string
        default: 'app01'

jobs:
  build:
    name: ساخت APK
    runs-on: ubuntu-latest

    steps:
      # ===== ۱. دریافت کد =====
      - name: 📥 دریافت کد از ریپو
        uses: actions/checkout@v4

      # ===== ۲. نصب Java 17 =====
      - name: ☕ نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ===== ۳. راه‌اندازی Android SDK =====
      - name: 🤖 راه‌اندازی Android SDK
        uses: android-actions/setup-android@v3

      # ===== ۴. کش کردن Gradle (سریع‌تر بشه) =====
      - name: ⚡ کش Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ===== ۵. کپی تنظیمات اپ روی قالب =====
      - name: 📋 کپی تنظیمات اپ
        run: |
          APP="${{ github.event.inputs.app_slug }}"
          if [ ! -f "configs/$APP.json" ]; then
            echo "❌ فایل configs/$APP.json پیدا نشد"
            exit 1
          fi
          cp "configs/$APP.json" "template/app/src/main/assets/config.json"
          echo "✅ تنظیمات $APP کپی شد"

      # ===== ۶. خواندن اطلاعات از JSON =====
      - name: 📖 خواندن نسخه از config
        id: cfg
        run: |
          APP="${{ github.event.inputs.app_slug }}"
          VER_CODE=$(jq -r '.branding.version_code // 1' "configs/$APP.json")
          VER_NAME=$(jq -r '.branding.version_name // "1.0.0"' "configs/$APP.json")
          PKG=$(jq -r '.branding.package_name // "ir.rosha.app"' "configs/$APP.json")
          echo "ver_code=$VER_CODE" >> $GITHUB_OUTPUT
          echo "ver_name=$VER_NAME" >> $GITHUB_OUTPUT
          echo "package=$PKG" >> $GITHUB_OUTPUT

      # ===== ۷. ساخت keystore موقت =====
      - name: 🔑 ساخت keystore موقت
        run: |
          mkdir -p template/keystore
          keytool -genkeypair -v \
            -keystore template/keystore/temp.jks \
            -alias tempkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "rosha${{ github.run_id }}" \
            -keypass "rosha${{ github.run_id }}" \
            -dname "CN=Rosha, OU=Apps, O=Rosha, L=Tehran, S=Tehran, C=IR"
          echo "✅ Keystore موقت ساخته شد"

      # ===== ۸. اعطای دسترسی اجرا به gradlew =====
      - name: 🔧 دسترسی اجرا به gradlew
        run: chmod +x template/gradlew

      # ===== ۹. Build APK =====
      - name: 🏗️ ساخت APK
        working-directory: ./template
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=keystore/temp.jks \
            -Pandroid.injected.signing.store.password="rosha${{ github.run_id }}" \
            -Pandroid.injected.signing.key.alias=tempkey \
            -Pandroid.injected.signing.key.password="rosha${{ github.run_id }}" \
            --no-daemon

      # ===== ۱۰. تغییر نام APK =====
      - name: 📝 تغییر نام APK
        run: |
          APP="${{ github.event.inputs.app_slug }}"
          APK=$(find template/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "❌ APK پیدا نشد"
            exit 1
          fi
          mkdir -p output
          cp "$APK" "output/${APP}.apk"
          echo "✅ APK آماده: ${APP}.apk"

      # ===== ۱۱. آپلود APK به عنوان Artifact =====
      - name: 📤 آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ github.event.inputs.app_slug }}
          path: output/*.apk
          retention-days: 30

      # ===== ۱۲. پاک کردن keystore موقت =====
      - name: 🗑️ پاک کردن keystore
        if: always()
        run: |
          rm -rf template/keystore
          echo "✅ Keystore موقت پاک شد"

      # ===== ۱۳. خلاصه =====
      - name: ✅ خلاصه
        run: |
          echo "=========================================="
          echo "🎉 Build با موفقیت انجام شد"
          echo "=========================================="
          echo "اپ: ${{ github.event.inputs.app_slug }}"
          echo "نسخه: ${{ steps.cfg.outputs.ver_name }}"
          echo "پکیج: ${{ steps.cfg.outputs.package }}"
          echo "=========================================="
