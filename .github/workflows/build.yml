# =========================================================
# build.yml — GitHub Actions برای ساخت APK
# مسیر: .github/workflows/build.yml
# =========================================================
# 📌 این فایل با آپلود تغییر تو پوشه‌ی configs/ خودکار اجرا میشه
# 📌 APK ساخته میشه و به عنوان Artifact ذخیره میشه
# =========================================================

name: Build APK

on:
  push:
    paths:
      - 'configs/*.json'
  workflow_dispatch:
    inputs:
      app_slug:
        description: 'شناسه‌ی اپ (app01, app02, ...)'
        required: true
        type: string
        default: 'app01'

jobs:
  build:
    name: ساخت APK
    runs-on: ubuntu-latest

    steps:
      # ===== ۱. دریافت کد =====
      - name: 📥 دریافت کد از ریپو
        uses: actions/checkout@v4

      # ===== ۲. تشخیص شماره‌ی اپ =====
      - name: 🔍 تشخیص اپ
        id: detect
        run: |
          # ===== اگه workflow_dispatch بود =====
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            APP="${{ github.event.inputs.app_slug }}"
          else
            # ===== اگه push بود، از اسم فایل پیداش کن =====
            CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep '^configs/.*\.json$' | head -n 1)
            if [ -z "$CHANGED" ]; then
              APP="app01"
            else
              APP=$(basename "$CHANGED" .json)
            fi
          fi
          echo "app_slug=$APP" >> $GITHUB_OUTPUT
          echo "✅ اپ: $APP"

      # ===== ۳. نصب Java 17 =====
      - name: ☕ نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ===== ۴. راه‌اندازی Android SDK =====
      - name: 🤖 راه‌اندازی Android SDK
        uses: android-actions/setup-android@v3

      # ===== ۵. کش Gradle =====
      - name: ⚡ کش Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ===== ۶. کپی تنظیمات اپ روی قالب =====
      - name: 📋 کپی تنظیمات اپ
        run: |
          APP="${{ steps.detect.outputs.app_slug }}"
          if [ ! -f "configs/$APP.json" ]; then
            echo "❌ فایل configs/$APP.json پیدا نشد"
            exit 1
          fi
          cp "configs/$APP.json" "template/app/src/main/assets/config.json"
          echo "✅ تنظیمات $APP کپی شد"

      # ===== ۷. خواندن اطلاعات از JSON =====
      - name: 📖 خواندن اطلاعات
        id: cfg
        run: |
          APP="${{ steps.detect.outputs.app_slug }}"
          VER_CODE=$(jq -r '.branding.version_code // 1' "configs/$APP.json")
          VER_NAME=$(jq -r '.branding.version_name // "1.0.0"' "configs/$APP.json")
          PKG=$(jq -r '.branding.package_name // "ir.rosha.app"' "configs/$APP.json")
          APP_NAME=$(jq -r '.branding.app_name // "Rosha"' "configs/$APP.json")
          echo "ver_code=$VER_CODE" >> $GITHUB_OUTPUT
          echo "ver_name=$VER_NAME" >> $GITHUB_OUTPUT
          echo "package=$PKG" >> $GITHUB_OUTPUT
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

      # ===== ۸. ساخت keystore موقت =====
      - name: 🔑 ساخت keystore موقت
        run: |
          mkdir -p template/keystore
          keytool -genkeypair -v \
            -keystore template/keystore/temp.jks \
            -alias tempkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "rosha${{ github.run_id }}" \
            -keypass "rosha${{ github.run_id }}" \
            -dname "CN=Rosha, OU=Apps, O=Rosha, L=Tehran, S=Tehran, C=IR"
          echo "✅ Keystore موقت ساخته شد"

      # ===== ۹. دسترسی اجرا به gradlew =====
      - name: 🔧 دسترسی اجرا
        run: chmod +x template/gradlew

      # ===== ۱۰. Build APK =====
      - name: 🏗️ ساخت APK
        working-directory: ./template
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=keystore/temp.jks \
            -Pandroid.injected.signing.store.password="rosha${{ github.run_id }}" \
            -Pandroid.injected.signing.key.alias=tempkey \
            -Pandroid.injected.signing.key.password="rosha${{ github.run_id }}" \
            --no-daemon

      # ===== ۱۱. تغییر نام APK =====
      - name: 📝 تغییر نام APK
        run: |
          APP="${{ steps.detect.outputs.app_slug }}"
          APK=$(find template/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "❌ APK پیدا نشد"
            exit 1
          fi
          mkdir -p output
          cp "$APK" "output/${APP}.apk"
          echo "✅ APK آماده: ${APP}.apk"

      # ===== ۱۲. آپلود APK =====
      - name: 📤 آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-${{ steps.detect.outputs.app_slug }}
          path: output/*.apk
          retention-days: 30

      # ===== ۱۳. پاک کردن keystore =====
      - name: 🗑️ پاک کردن keystore
        if: always()
        run: |
          rm -rf template/keystore
          echo "✅ Keystore موقت پاک شد"

      # ===== ۱۴. خلاصه =====
      - name: ✅ خلاصه
        run: |
          echo "=========================================="
          echo "🎉 Build با موفقیت انجام شد"
          echo "=========================================="
          echo "اپ: ${{ steps.detect.outputs.app_slug }}"
          echo "اسم: ${{ steps.cfg.outputs.app_name }}"
          echo "نسخه: ${{ steps.cfg.outputs.ver_name }}"
          echo "پکیج: ${{ steps.cfg.outputs.package }}"
          echo "=========================================="
          echo "📥 دانلود APK:"
          echo "برو به Actions → آخرین Build → Artifacts"
          echo "=========================================="
