/* =========================================================
   app/build.gradle  —  تنظیمات اپ
   مسیر: template/app/build.gradle
   ========================================================= */

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ir.rosha.app'
    compileSdk 34

    defaultConfig {
        applicationId "ir.rosha.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    /* ===== خواندن از config.json در زمان Build ===== */
    def configFile = file("src/main/assets/config.json")
    if (configFile.exists()) {
        def cfg = new groovy.json.JsonSlurper().parseText(configFile.text)
        def branding = cfg.branding ?: [:]

        defaultConfig {
            if (branding.package_name) {
                applicationId branding.package_name
            }
            if (branding.version_code) {
                versionCode branding.version_code as int
            }
            if (branding.version_name) {
                versionName branding.version_name
            }
        }

        def adv = cfg.advanced ?: [:]
        if (adv.min_sdk) {
            defaultConfig {
                minSdk adv.min_sdk as int
            }
        }
        if (adv.target_sdk) {
            defaultConfig {
                targetSdk adv.target_sdk as int
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.4'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    /* ===== Core ===== */
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    /* ===== Compose ===== */
    implementation platform('androidx.compose:compose-bom:2024.01.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    /* ===== Navigation ===== */
    implementation 'androidx.navigation:navigation-compose:2.7.6'

    /* ===== WebView ===== */
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    /* ===== DataStore (برای ذخیره‌ی تنظیمات محلی) ===== */
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    /* ===== JSON ===== */
    implementation 'com.google.code.gson:gson:2.10.1'

    /* ===== Coil (برای لود عکس) ===== */
    implementation 'io.coil-kt:coil-compose:2.5.0'

    /* ===== Splash Screen ===== */
    implementation 'androidx.core:core-splashscreen:1.0.1'

    /* ===== Test ===== */
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.01.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
